<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@100..900&display=swap');

        .gowun-batang-regular {
            font-family: "Gowun Batang", serif;
            font-weight: 400;
            font-style: normal;
        }

        #header, #nav, #section, #content, #banner, #footer {
            border: 1px solid purple;
            font-weight: bold;
            color: darkgreen;
        }

        #header {
            width: 1000px;
            height: 100px;
            margin: 0 0 7px 0;
            background-color: rgba(154, 205, 50, 0.75);
            text-align: center;
            line-height: 100px;
        }

        #nav {
            height: 120px;
            text-align: center;
            line-height: 50px;
            margin: 0 0 7px 0;
            width: 1000px;
        }

            #nav ul {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

                #nav ul li {
                    float: left;
                    width: 188px;
                    height: 50px;
                    line-height: 50px;
                    list-style: none;
                    text-align: center;
                    background-color: rgba(154, 205, 50, 0.5);
                    border-right: 5px solid white;
                    box-sizing: border-box;
                }

                    #nav ul li:first-child {
                        border-radius: 25px 0 0 25px;
                        margin: 0 0 0 30px;
                    }

                    #nav ul li:last-child {
                        border-radius: 0 25px 25px 0;
                        margin: 0 30px 0 0;
                    }

            #nav li > a {
                text-decoration: none;
                color: forestgreen;
                font-weight: bold;
            }

        #section {
            width: 1000px;
            overflow: hidden;
        }

        #content {
            float: left;
            width: 830px;
            height: 300px;
            line-height: 40px;
            text-align: center;
            margin: 7px 5px 7px 5px;
            position: relative;
            overflow: hidden;
        }

            #content img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                opacity: 0.7;
            }

        .content_text {
            position: absolute;
            top: 7%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
        }

        #banner {
            width: 150px;
            height: 300px;
            margin: 7px 5px 7px 0;
            position: relative;
            overflow: hidden;
        }

            #banner img {
                height: 80%;
                width: 90%;
                position: absolute;
                left: 5px;
                bottom: 0;
                opacity: 0.4;
            }

        .banner_text {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 16px;
            font-weight: bold;
            color: darkgreen;
        }

        #footer {
            width: 1000px;
            height: 100px;
            background-color: rgba(154, 205, 50, 0.75);
            text-align: center;
            line-height: 100px;
            margin-top: 7px;
        }
    </style>
</head>
<body>
    <div id="header">HEADER</div>
    <div id="nav">
        NAVIGATION
        <nav>
            <ul>
                <li><a href="menu1">menu1</a></li>
                <li><a href="menu1">menu2</a></li>
                <li><a href="menu1">menu3</a></li>
                <li><a href="menu1">menu4</a></li>
                <li><a href="menu1">menu5</a></li>
            </ul>
        </nav>
    </div>
    <div id="section">
        <div id="content">
            <img src="ch05/배경사진.png" alt="배경" />
            <div class="content_text">
                CONTENT
            </div>
        </div>
        <div id="banner">
            <img src="ch05/이미지1.png" alt="이미지1" />
            <div class="banner_text">
                BANNER
            </div>
        </div>
    </div>
    <div id="footer">FOOTER</div>
</body>
</html>
