<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        div#wrap {
            width: 350px;
            margin: 0 auto; /* 가운데 배치 */
        }

        header {
            color: orangered;
            text-align: center;
        }

        section {
            border-top: 2px solid gray;
            border-bottom: 2px solid gray;
        }

            section h4[title^='남자'] {
                background: url('ch04/man.png') no-repeat;
                padding: 0 0 0 30px; /* 안여백 위 우 하 좌 */
            }

            section h4[title^='여자'] {
                background: url('ch04/woman.png') no-repeat;
                padding: 0 0 0 30px; /* 안여백 위 우 하 좌 */
            }

            section p {
                text-align: center;
            }

            section a {
                text-decoration: none; /* 밑줄 없음 */
                color: navy;
            }

                section a[href$='.docx'], section a[href$='.doc'] {
                    background: url(ch04/word.png) no-repeat right;
                    padding: 0 30px 0 0;
                }

                section a[href$='.xlsx'], section a[href$='.xls'] {
                    background: url(ch04/excel.png) no-repeat right;
                    padding-right: 30px;
                }
                footer{
                    text-align:center; color:#888888;
                }
    </style>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>객실 안내</h1>
        </header>
        <section>
            <h4 title="남자">신사</h4>
            <ul>
                <li>공동 취사실 및 욕설 사용</li>
                <li>1인 20,000원</li>
            </ul>
            <h4 title="여자">숙녀</h4>
            <ul>
                <li>취사 기구 완비 실내 욕실 사용</li>
                <li>1인 30,000원</li>
            </ul>
            <br />
            <p><a href="ch04/intro.docx">유의사항 다운로드</a></p>
            <p><a href="ch04/intro.xlsx">객실자료 다운로드</a></p>
        </section>
        <footer>
            <p>서울시 OO구 OO로</p>
        </footer>
    </div>
</body>
</html>
