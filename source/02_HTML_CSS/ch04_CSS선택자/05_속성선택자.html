<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        input {
            color: green;
        }

            input[type='password'] { /* type이 password인 속성 */
                color: black;
            }

            input[type^='te'] { /* type^은 te로 시작하는 태그 */
                width: 100px;
                color: darkorange;
            }

            input[name$='me'] { /* name 속성이 me로 끝나는 태그 */
                border: 1px solid red;
                padding: 10px;
                outline: 0; /* input 태그가 focus 되었을 때 나타나는 border */
            }

        img[alt] {
            width: 50px;
            border: 2px solid red;
        }
        /* img태그 중 alt속성이 있는 태그 */
    </style>
</head>
<body>
    <form>
        이름 <input type="text" name="name" /><br />
        아이디 <input type="text" name="id" /><br />
        비번 <input type="password" name="pw" /><br />
        전번 <input type="tel" name="tel" /><br />
        <img src="ch04/나야들기름.jpg" width="100" alt="최강록" />
        <input type="submit" />
    </form>
</body>
</html>
