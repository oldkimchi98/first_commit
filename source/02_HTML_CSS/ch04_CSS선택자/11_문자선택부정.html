<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        #wrap {
            width: 750px;
            margin: 0 auto;
        }

        #header {
            border: 1px solid gray;
            text-align: center;
        }

        #content {
            padding: 0 10px;
            text-align: justify; /* 양쪽 맞춤 정렬*/
        }

            #content p:nth-child(2)::first-line,
            #content p:nth-child(3)::first-line {
                color: blue;
                font-weight: bold; /* 진하게 */
                font_size: 20px;
            }

            #content p:nth-child(2)::first-letter {
                font-size: 2em; /* 원래 크기의 2배 */
            }

            #content p:nth-child(3) span {
                font-size: 2em;
            }

            #content a {
                text-decoration: none;
                color: blue;
                font-size: 1.5em;
            }

                #content a:after { /* 링크선택자 */
                    content: '-'attr(href);
                }

            #content li:not(.web) a { /* 부정선택자 */
                background-color: yellow;
            }
            #footer ul{
                border-top:1px soild gray;
                overflow:hidden;
            }
            #footer ul li{
                float:left;
                list-style:none;
                padding:15px;
            }
            #footer ul li:first-child{padding-top:30px;}
    </style>
</head>
<body>
    <div id="wrap">
        <div id="header">
            <h1>제목이나 회사명</h1>
        </div>
        <div id="content">
            <p>나는 생각한다</p>
            <p>그러므로 존재한다</p>
            <p><span>L</span>신의 존재를 증명하기보다 나의 가치를 증명하는 것이 더 쉽다</p>
            <ul>
                <li><a href="http://www.naver.com" target="_blank">네이버</a></li>
                <li class="web"><a href="http://www.daum.net">다음</a></li>
                <li><a href="http://www.google.com" target="_blank">구글</a></li>
                <li><a href="http://zum.com" target="_blank">줌</a></li>
            </ul>
        </div>
        <div id="footer">
            <ul>
                <li><img src="ch04/logo.png" /></li>
                <li><img src="ch04/address.png" /></li>
            </ul>
        </div>
    </div>
</body>
</html>
