<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <script>
        // document.write(i+'<br>');
        let i =10;
        document.write(i+'<br>');
        // function 함수이름(매개변수){
        i=20; /* i를 중간에 수정 */
        // }
        // 함수이름(); 악명함수는 정의 전에 사용불가
        document.write(i+'<br>');
        let functionVar = function(i, j){
            // alert('함수 표현식 test i='+i + ', j=' + j);
            alert('함수 표현식 test i=${i}, j=${j}');
        };
        functionVar(10, 20);
        functionVar = (i, j) => {
            alert(i + j);
        };
        functionVar(10, 20);
        </script>
</head>

</body>
