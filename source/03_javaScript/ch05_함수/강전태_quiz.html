<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
        <style>
            body {
                background-image: url(ch05_img/img01.png); 
                background-size: 100%;
                font-size: 4.5em;
                font-weight: bold;
                color: gray;
            }
    </style>
    <script>
        /*힌트 : 배열 이용하면 소스가 효율적 */

        // img01.png(노란색), img02.png(파란색), img03.png(하얀색)
        let sec = 0; // 몇초가 지났는지 저장 변수
        const color = ['red', 'orangered', 'orange'];
        const img = [
            'url(ch05_img/img01.png)',
            'url(ch05_img/img02.png)',
            'url(ch05_img/img03.png)'
        ];
        var id = setInterval(() => {
            sec++;
            document.body.innerHTML =`${new Date().toLocaleString()} - ${sec}초 지남`
            document.body.style.backgroundImage = img[sec % 3];
            document.body.style.color = color[sec%3];
        }, 1000);

        setTimeout(() => {
            clearInterval(id);
            document.body.innerHTML += '<br>타이머 종료';
        }, 10000);
        // document.write('${new Date().toLocaleString()} - ${sec}초 지남');
        // document.body.style = 'background-image: url(${img[sec%3]})';
        // document.body.style.backgroundimage = 'img[sec%3]'
        // document.body.style.color = color[sec%3];
        // 1초마다
        
        // document.body.style = 'background-image: url(ch05_img/img0' + (sec % 3 + 1) + '.png)';
        // document.body.style = 'background-color: #ff0000';
        //document.body.style = 'background-image: url(ch05_img/img01.png)';
    </script>
</head>
