<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <script>
        // 생성자 함수
        function Student(name, kor, mat, eng) {     // 생성자 이름은 대문자로 입력할 것.
            this.name = name;
            this.kor = kor;
            this.mat = mat;
            this.eng = eng;
            this.getSum = function () {
                return this.kor + this.mat + this.eng;
            };
            this.getAvg = function () {
                return Math.round(this.getSum() / 3);
            };
            this.toString = function () {
                let output = '';
                for (let key in this) {
                    if (key != 'getSum' && key != 'getAvg' && key != 'toString') {
                        output += key + ':' + this[key] + ' &nbsp; ';
                    } else if (key == 'getSum' || key == 'getAvg') {
                        output += key.substring(3).toUpperCase() + ':' + this[key]() + ' &nbsp; ';
                    }   //    if
                }   //    for
                return output;
            };  //  this.toString
        }   //  생성자함수
        // s = new Student('홍길동', 90, 90, 80);
        // document.write(s);
        let students = [];
        students.push(makeStudent('홍길동', 99, 98, 90));
        students.push(makeStudent('마길동', 95, 90, 90));
        students.push(makeStudent('김길동', 91, 98, 90));
        students.push(makeStudent('이길동', 91, 60, 78));
        students.push(makeStudent('홍낄동', 94, 98, 90));
        students.array.forEach(element => document.write(element + '<br>'));
    </script>
</head>
