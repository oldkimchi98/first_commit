<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        table {
            width: 350px;
            margin: 20px auto;
            padding: 20px 10px;
        }

        table,
        input[type='text'],
        input[type='password'] {
            border: 1px solid #385d81;
            outline: 1px solid #385d81;
            padding: 2px;
        }

        input[type='submit'],
        input[type='reset'],
        input[type='button'],
        button {
            background-color: #385d81;
            border: 0;
            outline: 0;
            color: white;
            border-radius: 3px;
            padding: 10px 20px;
            margin: 5px;
        }

        td,
        th {
            padding: 5px 10px;
            text-align: center;
        }
    </style>
    <script>
        const joinCheck = () => {
            //  패턴들(숫자, 알파벳, 특수문자), 이메일정규표현식패턴, [이름정규표현식패턴] 
            let patternNum = /[0-9]/; // 숫자 패턴
            let patternEng = /[a-zA-Z]/; // 알파벳 문자 패턴
            let patternUpEng = /[A-Z]/;  // 대문자 패턴
            let patternLowEng = /[a-z]/;  // 소문자 패턴
            let patternKor = /[가-힣]/; // 한글문자 패턴
            let patternSpe = /[~`!@#$%^&*()_\-+=\|\\\[\]{}'":;?\/<>,\.]/; // 특수문자 패턴
            let patternEmail = /^\w+@\w+(\.\w+){1,2}$/;
            //  입력상자에서 입력받은 내용을 변수
            // name = frm.name.value.trim();   //  html 3장 form태그 유효성 검사
            //  유효한 데이터를 입력하지 않을 경우 return false 부분
            let name = frm.name.value.trim();
            let mail = frm.mail.value.trim();
            let pw = frm.pw.value.trim();
            let pwChk = frm.pwChk.value.trim();

            if(name.length <2){
                alert('2글자 이상의 이름으로 입력해주세요');
                frm.name.focus();
                return false;
            }
            if(mail && mail.match(patternEmail)){
                alert('메일의 형식에 맞춰서 재입력해주세요'.)
                frm.mail.focus();
                return false;
            }
        };
    </script>
</head>

<body>
    <form action="#" name="frm" onsubmit="return joinCheck()">
        <table>
            <tr>
                <th>이름</th>
                <td>
                    <input type="text" name="name" placeholder="특수문자와 숫자 X" autofocus="autofocus" />
                </td>
            </tr>
            <tr>
                <th>메일</th>
                <td><input type="text" name="mail" placeholder="메일 형식에 맞춰주세요" /></td>
            </tr>
            <tr>
                <th>비밀번호</th>
                <td><input type="password" name="pw" placeholder="특수문자,알파벳,숫자 포함" /></td>
            </tr>
            <tr>
                <th>비밀번호확인</th>
                <td><input type="password" name="pwChk" /></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="회원가입" />
                    <input type="reset" value="취소" />
                    <input type="button" value="로그인" />
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
