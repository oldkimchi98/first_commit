<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <script>
        window.onload = () => {
            var header1 = document.querySelector('h1.header');  // 해당 선택자 태그 하나
            header1.innerHTML = '첫번째만';
            var head = document.querySelectorAll('h1'); //  6방법 : 해당 선택자 태그들을 배열
            let col = ['red', 'orange'];

            for (let idx in head) {
                head[idx].style.backgroundColor = col[idx];
            }

            var param = document.querySelectorAll('input[type=text]')[0];
            param.value = '이상 문서객체 가져오기 끝';
        };
    </script>
</head>

<body>
    <h1 class="header">HEADER1</h1>
    <h1 class="header">HEADER2</h1>
    <input type="text" name="param">
</body>

</html>
